<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="870" viewBox="0 0 1120 870" font-family="Arial, Helvetica, sans-serif"><rect width="1120" height="870" fill="#ffffff"/><rect x="190" y="20" width="900" height="830" fill="#ffffff" stroke="#222222" stroke-width="1.4"/><text x="640.0" y="44.0" font-size="15" text-anchor="middle" fill="#222222" font-weight="bold">XML Conference Analyzer: аналіз XML-файлів про наукові конференції</text><g fill="none" stroke="#222222" stroke-width="1.4"><circle cx="75" cy="399.0" r="9.0" fill="#ffffff"/><path d="M75 408.0V429.0M58.8 415.2H91.2M75 429.0L60.0 450M75 429.0L90.0 450"/></g><text x="75.0" y="465.0" font-size="13" text-anchor="middle" fill="#222222">Користувач</text><ellipse cx="400" cy="110" rx="120.0" ry="29.0" fill="#eaf2fb" stroke="#222222" stroke-width="1.2"/><text x="400.0" y="114.5" font-size="13" text-anchor="middle" fill="#222222">Відкрити XML-файл</text><ellipse cx="400" cy="195" rx="120.0" ry="29.0" fill="#eaf2fb" stroke="#222222" stroke-width="1.2"/><text x="400.0" y="191.5" font-size="13" text-anchor="middle" fill="#222222">Відкрити вбудований</text><text x="400.0" y="207.5" font-size="13" text-anchor="middle" fill="#222222">приклад conferences.xml</text><ellipse cx="400" cy="295" rx="120.0" ry="29.0" fill="#eaf2fb" stroke="#222222" stroke-width="1.2"/><text x="400.0" y="299.5" font-size="13" text-anchor="middle" fill="#222222">Знайти конференції</text><ellipse cx="400" cy="390" rx="120.0" ry="29.0" fill="#eaf2fb" stroke="#222222" stroke-width="1.2"/><text x="400.0" y="386.5" font-size="13" text-anchor="middle" fill="#222222">Очистити результати</text><text x="400.0" y="402.5" font-size="13" text-anchor="middle" fill="#222222">і параметри пошуку</text><ellipse cx="400" cy="475" rx="120.0" ry="29.0" fill="#eaf2fb" stroke="#222222" stroke-width="1.2"/><text x="400.0" y="471.5" font-size="13" text-anchor="middle" fill="#222222">Зберегти результати</text><text x="400.0" y="487.5" font-size="13" text-anchor="m